; Gleicher Zweck wie php.ini im selben Ordner - manche PHP-Betriebsarten
; (insb. PHP-FPM, je nach all-inkl-Konfiguration) lesen ".user.ini" statt
; "php.ini". Beide Dateien parallel auszuliefern schadet nicht.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 30
